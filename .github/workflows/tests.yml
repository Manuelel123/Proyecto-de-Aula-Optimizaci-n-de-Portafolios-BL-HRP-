name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Python comes from .python-version; dependencies from uv.lock.
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run the test suite
        run: uv run --frozen pytest -q
