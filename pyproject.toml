[project]
name = "optimizacion-portafolios"
version = "0.1.0"
description = "Portfolio monitoring and optimization using Flask"
readme = "README.md"
authors = [
    { name = "Manuelel123", email = "bedoyayonatan164@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "flask>=3.1.2",
    "flask-login>=0.6.3",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "matplotlib>=3.9.0",
    "numpy>=2.0.0",
    "pandas>=2.0.0",
    "plotly>=7.1,<8",
    "python-dotenv>=1.0",
    "quantstats>=0.0.77",
    "requests>=2.31",
    "scipy>=1.14.0,<1.17",
    "skfolio>=1.8.0",
    "statsmodels>=0.14.4",
    "tiingo>=0.16.1",
    "vectorbt>=1.1.2",
    "waitress>=3.0.2",
    "yfinance>=1.7.0",
]

[project.scripts]
optimizacion-portafolios = "optimizacion_portafolios.web:run"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
